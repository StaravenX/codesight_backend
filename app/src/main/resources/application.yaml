spring:
  application:
    name: codesight_backend
  profiles:
    include: auth, ai, search, article
  elasticsearch:
    uri: ${ES_URI:http://localhost:9200}
    username: ${ES_USERNAME}
    password: ${ES_PASSWORD}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:codesight}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
        ack-mode: manual_immediate
  threads:
    virtual:
      enabled: true
  ai:
    openai:
      base-url: ${OPENAI_BASE_URL}
      api-key: ${OPENAI_API_KEY}
      chat:
        completions-path: /chat/completions
        options:
          model: ${OPENAI_CHAT_MODEL}
          temperature: 0.3
      embedding:
        embeddings-path: /embeddings
        options:
          model: ${OPENAI_EMBEDDING_MODEL}
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

oss:
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  region: cn-hangzhou
  bucket: codesight

app:
  cache:
    caffeine:
      article-detail:
        initial-capacity: 100
        max-size: 10000
        ttl-seconds: 300
      author-card:
        initial-capacity: 100
        max-size: 5000
        ttl-seconds: 300
      category:
        initial-capacity: 10
        max-size: 500
        ttl-seconds: 600