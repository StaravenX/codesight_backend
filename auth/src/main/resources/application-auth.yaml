spring:
  application:
    name: auth
auth:
  jwt:
    issuer: codesight
    key-id: codesight-key
    private-key: classpath:keys/private.pem
    public-key: classpath:keys/public.pem
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  verification:
    code-length: 6
    ttl: PT5M
    max-attempts: 5
    send-interval: PT60S
    daily-limit: 10
    lock-time: PT30M
  password:
    bcrypt-strength: 12
    min-length: 8
  login:
    max-ip-attempts: 20
    max-account-attempts: 20
    account-lock-time: PT15M
    ip-lock-time: PT30M